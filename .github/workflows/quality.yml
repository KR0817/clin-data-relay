name: Source quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --all-extras --frozen
      - name: Verify Python compilation
        run: .\.venv\Scripts\python.exe -m compileall -q app
      - name: Verify workbench JavaScript
        run: node --check app\static\js\workbench.js
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q

  postgres-repository:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clindata_relay_test
          POSTGRES_USER: clindata_relay
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clindata_relay -d clindata_relay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLINDATA_TEST_POSTGRES_DSN: postgresql://clindata_relay:ci-${{ github.run_id }}@127.0.0.1:5432/clindata_relay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked central dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --extra central --extra dev --frozen
      - name: Run PostgreSQL repository contract
        run: >-
          ./.venv/bin/python -m pytest -q
          tests/test_postgres_repository.py
          tests/test_package_import_repository.py
          tests/test_reviewed_import_repository.py
          tests/test_confirmed_data_repository.py
          tests/test_study_membership_repository.py
          tests/test_institutional_session_repository.py
