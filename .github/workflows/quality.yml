name: Source quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.32
          uv sync --all-extras --frozen
      - name: Verify Python compilation
        run: .\.venv\Scripts\python.exe -m compileall -q app
      - name: Verify workbench JavaScript
        run: node --check app\static\js\workbench.js
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest -q
